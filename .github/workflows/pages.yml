name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 供 deploy-pages 取得部署權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，且不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 整個 repo 原樣上傳，維持現有網址結構（/V2_allpage/... 等）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
